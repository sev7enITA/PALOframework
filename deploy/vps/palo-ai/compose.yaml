name: palo-ai-governance

services:
  palo-identity-db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/palo_identity_db_password
    secrets:
      - palo_identity_db_password
    volumes:
      - palo_identity_db:/var/lib/postgresql/data
    networks: [identity_db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  palo-identity:
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Containerfile.identity
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/palo_identity_admin_password)"
        export KC_DB_PASSWORD="$$(cat /run/secrets/palo_identity_db_password)"
        export PALO_READER_SMOKE_CLIENT_SECRET="$$(cat /run/secrets/palo_reader_smoke_client_secret)"
        export PALO_CURATOR_SMOKE_CLIENT_SECRET="$$(cat /run/secrets/palo_curator_smoke_client_secret)"
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm --server-async-bootstrap=false
    restart: unless-stopped
    mem_limit: 896m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: palo-admin
      KC_DB: postgres
      KC_DB_URL_HOST: palo-identity-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HOSTNAME: https://${PALO_DOMAIN}/identity
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: local
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_FEATURES: cimd
      KC_LOG: console
      KC_LOG_CONSOLE_OUTPUT: json
      KC_LOG_LEVEL: INFO
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=30 -XX:MaxRAMPercentage=65
      PALO_DOMAIN: ${PALO_DOMAIN}
    secrets:
      - palo_identity_admin_password
      - palo_identity_db_password
      - palo_reader_smoke_client_secret
      - palo_curator_smoke_client_secret
    volumes:
      - ./identity/palo-realm.json:/opt/keycloak/data/import/palo-realm.json:ro
    networks: [identity_db, identity_edge, identity_egress]
    depends_on:
      palo-identity-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /identity/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  opa:
    image: ${OPA_IMAGE:-openpolicyagent/opa:1.17.0-static}
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - --log-level=info
      - /policy/agent-delegation.rego
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../../../examples/policy-as-code/agent-delegation.rego:/policy/agent-delegation.rego:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--data", "/policy/agent-delegation.rego", "data.palo.agentic.governance"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  palo-gateway:
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile
    command: ["node", "packages/palo-mcp-server/gateway.js"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PALO_GATEWAY_HOST: 0.0.0.0
      PALO_GATEWAY_PORT: 8787
      PALO_GATEWAY_TOKEN_FILE: /run/secrets/palo_gateway_token
      PALO_HMAC_KEYS_JSON_FILE: /run/secrets/palo_hmac_keys
      PALO_OPA_URL: http://opa:8181
      PALO_DATA_DIR: /var/lib/palo
    secrets:
      - palo_gateway_token
      - palo_hmac_keys
    volumes:
      - palo_data:/var/lib/palo
    ports:
      - 127.0.0.1:8787:8787
    networks: [backend]
    depends_on:
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  palo-mcp:
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile
    command: ["node", "packages/palo-mcp-server/http.js"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PALO_MCP_HTTP_HOST: 0.0.0.0
      PALO_MCP_HTTP_PORT: 8788
      PALO_MCP_ALLOWED_HOSTS: ${PALO_DOMAIN},127.0.0.1,localhost
      PALO_MCP_EXPOSED_TOOLS: palo_get_registry,palo_verify_action_authority,palo_request_approval,palo_get_approval_status,palo_verify_evidence,palo_verify_ledger
      PALO_MCP_HTTP_TOKEN_FILE: /run/secrets/palo_mcp_token
      PALO_HMAC_KEYS_JSON_FILE: /run/secrets/palo_hmac_keys
      PALO_OPA_URL: http://opa:8181
      PALO_DATA_DIR: /var/lib/palo
    secrets:
      - palo_mcp_token
      - palo_hmac_keys
    volumes:
      - palo_data:/var/lib/palo
    networks: [backend]
    depends_on:
      palo-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health',{headers:{Host:'127.0.0.1'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  palo-guide-mcp:
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile.reader
    command: ["packages/palo-mcp-server/reader-http.js"]
    restart: unless-stopped
    read_only: true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      PALO_MCP_HTTP_HOST: 0.0.0.0
      PALO_MCP_HTTP_PORT: 8789
      PALO_MCP_ALLOWED_HOSTS: ${PALO_DOMAIN},127.0.0.1,localhost
      PALO_MCP_ALLOWED_ORIGINS: ${PALO_MCP_ALLOWED_ORIGINS:-sev7enita.github.io}
      PALO_READER_RUNTIME_MODE: production
      PALO_READER_MAX_BODY_BYTES: 65536
      PALO_READER_RATE_LIMIT_PER_MINUTE: ${PALO_READER_RATE_LIMIT_PER_MINUTE:-120}
      PALO_READER_MAX_CONCURRENCY: ${PALO_READER_MAX_CONCURRENCY:-32}
      PALO_READER_MAX_CONCURRENCY_PER_CLIENT: ${PALO_READER_MAX_CONCURRENCY_PER_CLIENT:-4}
      PALO_KNOWLEDGE_WRITE_ENABLED: "false"
      PALO_KNOWLEDGE_REVIEW_ENABLED: "false"
      PALO_KNOWLEDGE_INCLUDE_CURATED_LOCAL: "false"
      PALO_AUTH_MODE: oidc
      PALO_MCP_PUBLIC_URL: https://${PALO_DOMAIN}/mcp-guide
      PALO_OIDC_ISSUER: https://${PALO_DOMAIN}/identity/realms/palo
      PALO_OIDC_AUDIENCE: https://${PALO_DOMAIN}/mcp-guide
      PALO_OIDC_JWKS_URI: https://${PALO_DOMAIN}/identity/realms/palo/protocol/openid-connect/certs
      PALO_OIDC_ALGORITHMS: ${PALO_OIDC_ALGORITHMS:-RS256}
      PALO_OIDC_ROLE_CLAIM: ${PALO_OIDC_ROLE_CLAIM:-roles}
      PALO_OIDC_SCOPE_CLAIM: ${PALO_OIDC_SCOPE_CLAIM:-scope}
      PALO_OIDC_CLIENT_ID_CLAIM: ${PALO_OIDC_CLIENT_ID_CLAIM:-azp}
      PALO_OIDC_TENANT_CLAIM: ${PALO_OIDC_TENANT_CLAIM:-tid}
      PALO_OIDC_TOKEN_TYPE: ${PALO_OIDC_TOKEN_TYPE:-JWT}
      PALO_OIDC_ALLOWED_CLIENT_IDS: ${PALO_READER_OIDC_ALLOWED_CLIENT_IDS:-palo-reader-smoke}
      PALO_OIDC_ALLOWED_TENANTS: ${PALO_OIDC_ALLOWED_TENANTS:-palo}
    networks: [reader_edge, reader_egress]
    depends_on:
      palo-identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8789/health',{headers:{Host:'127.0.0.1'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  palo-guide-edge:
    image: ${NGINX_IMAGE:-nginx:1.29.1-alpine}
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./nginx-reader-edge.conf:/etc/nginx/nginx.conf:ro
    networks: [reader_edge]
    depends_on:
      palo-guide-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--header=Host: 127.0.0.1", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  palo-guide-curator-mcp:
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile
    command: ["node", "packages/palo-mcp-server/http.js"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PALO_MCP_HTTP_HOST: 0.0.0.0
      PALO_MCP_HTTP_PORT: 8790
      PALO_MCP_ALLOWED_HOSTS: ${PALO_DOMAIN},127.0.0.1,localhost
      PALO_MCP_ALLOWED_ORIGINS: ${PALO_MCP_ALLOWED_ORIGINS:-sev7enita.github.io}
      PALO_MCP_EXPOSED_TOOLS: palo_explain_framework,palo_infer_governance_route,palo_plan_product_integration,palo_list_knowledge_sources,palo_search_knowledge,palo_get_knowledge_record,palo_submit_knowledge_draft,palo_list_knowledge_drafts,palo_get_knowledge_draft,palo_review_knowledge_draft
      PALO_DATA_DIR: /var/lib/palo-guide-curator
      PALO_KNOWLEDGE_DIR: /var/lib/palo-knowledge
      PALO_KNOWLEDGE_WRITE_ENABLED: "true"
      PALO_KNOWLEDGE_REVIEW_ENABLED: "true"
      PALO_KNOWLEDGE_REQUIRE_REVIEWER_SEPARATION: "true"
      PALO_AUTH_MODE: oidc
      PALO_MCP_PUBLIC_URL: https://${PALO_DOMAIN}/mcp-guide-curator
      PALO_OIDC_ISSUER: https://${PALO_DOMAIN}/identity/realms/palo
      PALO_OIDC_AUDIENCE: https://${PALO_DOMAIN}/mcp-guide-curator
      PALO_OIDC_JWKS_URI: https://${PALO_DOMAIN}/identity/realms/palo/protocol/openid-connect/certs
      PALO_OIDC_ALGORITHMS: ${PALO_OIDC_ALGORITHMS:-RS256}
      PALO_OIDC_ROLE_CLAIM: ${PALO_OIDC_ROLE_CLAIM:-roles}
      PALO_OIDC_SCOPE_CLAIM: ${PALO_OIDC_SCOPE_CLAIM:-scope}
      PALO_OIDC_CLIENT_ID_CLAIM: ${PALO_OIDC_CLIENT_ID_CLAIM:-azp}
      PALO_OIDC_TENANT_CLAIM: ${PALO_OIDC_TENANT_CLAIM:-tid}
      PALO_OIDC_TOKEN_TYPE: ${PALO_OIDC_TOKEN_TYPE:-JWT}
      PALO_OIDC_ALLOWED_CLIENT_IDS: ${PALO_CURATOR_OIDC_ALLOWED_CLIENT_IDS:-palo-curator-smoke}
      PALO_OIDC_ALLOWED_TENANTS: ${PALO_OIDC_ALLOWED_TENANTS:-palo}
    volumes:
      - palo_guide_curator_data:/var/lib/palo-guide-curator
      - palo_knowledge:/var/lib/palo-knowledge
    networks: [backend]
    depends_on:
      palo-identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health',{headers:{Host:'127.0.0.1'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  palo-hub-migrate:
    profiles: [hub-migration]
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile
    command: ["node", "packages/palo-governance-control-plane/migrate.js"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PALO_HUB_MODE: production
      PALO_HUB_DATABASE_URL_FILE: /run/secrets/palo_hub_migration_database_url
      PALO_HUB_DATABASE_APPLICATION_ROLE: ${PALO_HUB_DATABASE_APPLICATION_ROLE:-}
    secrets:
      - palo_hub_migration_database_url
    networks: [edge]

  palo-hub-control-plane:
    profiles: [hub-control-plane]
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile
    command: ["node", "packages/palo-governance-control-plane/index.js"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PALO_HUB_MODE: production
      PALO_HUB_HOST: 0.0.0.0
      PALO_HUB_PORT: 8790
      PALO_HUB_PUBLIC_URL: https://${PALO_DOMAIN}/control-plane
      PALO_HUB_ALLOWED_ORIGINS: https://${PALO_DOMAIN}
      PALO_HUB_DATABASE_URL_FILE: /run/secrets/palo_hub_database_url
      PALO_HUB_OIDC_ISSUER: ${PALO_HUB_OIDC_ISSUER:-}
      PALO_HUB_OIDC_AUTHORIZATION_ENDPOINT: ${PALO_HUB_OIDC_AUTHORIZATION_ENDPOINT:-}
      PALO_HUB_OIDC_TOKEN_ENDPOINT: ${PALO_HUB_OIDC_TOKEN_ENDPOINT:-}
      PALO_HUB_OIDC_JWKS_URI: ${PALO_HUB_OIDC_JWKS_URI:-}
      PALO_HUB_OIDC_CLIENT_ID: ${PALO_HUB_OIDC_CLIENT_ID:-}
      PALO_HUB_OIDC_AUDIENCE: ${PALO_HUB_OIDC_AUDIENCE:-}
      PALO_HUB_OIDC_CLIENT_SECRET_FILE: /run/secrets/palo_hub_oidc_client_secret
      PALO_HUB_STEP_UP_ACR_VALUES: ${PALO_HUB_STEP_UP_ACR_VALUES:-}
      PALO_HUB_ADAPTERS_JSON: "${PALO_HUB_ADAPTERS_JSON:-[]}"
      PALO_HUB_ADAPTER_TOKEN_FILE: /run/secrets/palo_hub_adapter_token
      PALO_HUB_SIGNER_URL: ${PALO_HUB_SIGNER_URL:-}
      PALO_HUB_SIGNER_TOKEN_FILE: /run/secrets/palo_hub_signer_token
      PALO_HUB_RUN_MIGRATIONS: "false"
      PALO_HUB_TRUST_PROXY: "true"
    secrets:
      - palo_hub_database_url
      - palo_hub_oidc_client_secret
      - palo_hub_adapter_token
      - palo_hub_signer_token
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>r.json().then(j=>{if(!r.ok||j.status!=='ok'||!j.persistence.schemaCurrent)process.exit(1)})).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  palo-hub-ui:
    profiles: [hub-control-plane]
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile.hub
      args:
        VITE_PALO_CONTROL_PLANE_URL: /control-plane
        VITE_PALO_PUBLIC_SITE_URL: https://sev7enita.github.io/PALOframework
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      PALO_DOMAIN: ${PALO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend, reader_edge, identity_edge]
    depends_on:
      palo-mcp:
        condition: service_healthy
      palo-guide-mcp:
        condition: service_healthy
      palo-guide-edge:
        condition: service_healthy
      palo-guide-curator-mcp:
        condition: service_healthy
      palo-identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  palo_gateway_token:
    file: ./secrets/gateway-token
  palo_mcp_token:
    file: ./secrets/mcp-token
  palo_hmac_keys:
    file: ./secrets/hmac-keys.json
  palo_hub_database_url:
    file: ./secrets/hub-database-url
  palo_hub_migration_database_url:
    file: ./secrets/hub-migration-database-url
  palo_hub_oidc_client_secret:
    file: ./secrets/hub-oidc-client-secret
  palo_hub_adapter_token:
    file: ./secrets/hub-adapter-token
  palo_hub_signer_token:
    file: ./secrets/hub-signer-token
  palo_identity_admin_password:
    file: ./secrets/identity-admin-password
  palo_identity_db_password:
    file: ./secrets/identity-db-password
  palo_reader_smoke_client_secret:
    file: ./secrets/reader-smoke-client-secret
  palo_curator_smoke_client_secret:
    file: ./secrets/curator-smoke-client-secret

volumes:
  palo_data:
  palo_guide_curator_data:
  palo_knowledge:
  palo_identity_db:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
  reader_edge:
    internal: true
  reader_egress:
  identity_db:
    internal: true
  identity_edge:
    internal: true
  identity_egress:
