worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout combined;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    limit_req_zone $binary_remote_addr zone=palo_reader_edge:1m rate=60r/m;

    server {
        listen 8080;
        server_name _;

        # This network is shared only with Caddy and the Reader. Caddy replaces
        # X-Forwarded-For with the actual public peer before forwarding here.
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        limit_req zone=palo_reader_edge burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        location / {
            proxy_pass http://palo-guide-mcp:8789;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
