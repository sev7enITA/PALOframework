name: palo-ai-governance

services:
  opa:
    image: ${OPA_IMAGE:-openpolicyagent/opa:1.17.0-static}
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - --log-level=info
      - /policy/agent-delegation.rego
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../../../examples/policy-as-code/agent-delegation.rego:/policy/agent-delegation.rego:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--data", "/policy/agent-delegation.rego", "data.palo.agentic.governance"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  palo-gateway:
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile
    command: ["node", "packages/palo-mcp-server/gateway.js"]
    restart: unless-stopped
    read_only: true
    mem_limit: 512m
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PALO_GATEWAY_HOST: 0.0.0.0
      PALO_GATEWAY_PORT: 8787
      PALO_GATEWAY_TOKEN_FILE: /run/secrets/palo_gateway_token
      PALO_HMAC_KEYS_JSON_FILE: /run/secrets/palo_hmac_keys
      PALO_OPA_URL: http://opa:8181
      PALO_DATA_DIR: /var/lib/palo
    secrets:
      - palo_gateway_token
      - palo_hmac_keys
    volumes:
      - palo_data:/var/lib/palo
    ports:
      - 127.0.0.1:18877:8787
    networks: [backend, host_access]
    depends_on:
      opa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  palo-mcp:
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile
    command: ["node", "packages/palo-mcp-server/http.js"]
    restart: unless-stopped
    read_only: true
    mem_limit: 512m
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PALO_MCP_HTTP_HOST: 0.0.0.0
      PALO_MCP_HTTP_PORT: 8788
      PALO_MCP_ALLOWED_HOSTS: ${PALO_DOMAIN},127.0.0.1,localhost
      PALO_MCP_EXPOSED_TOOLS: palo_get_registry,palo_verify_action_authority,palo_request_approval,palo_get_approval_status,palo_verify_evidence,palo_verify_ledger
      PALO_MCP_HTTP_TOKEN_FILE: /run/secrets/palo_mcp_token
      PALO_HMAC_KEYS_JSON_FILE: /run/secrets/palo_hmac_keys
      PALO_OPA_URL: http://opa:8181
      PALO_DATA_DIR: /var/lib/palo
    secrets:
      - palo_mcp_token
      - palo_hmac_keys
    volumes:
      - palo_data:/var/lib/palo
    ports:
      - 127.0.0.1:18878:8788
    networks: [backend, host_access]
    depends_on:
      palo-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health',{headers:{Host:'127.0.0.1'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  palo-guide-mcp:
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile
    command: ["node", "packages/palo-mcp-server/http.js"]
    restart: unless-stopped
    read_only: true
    mem_limit: 384m
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PALO_MCP_HTTP_HOST: 0.0.0.0
      PALO_MCP_HTTP_PORT: 8789
      PALO_MCP_ALLOWED_HOSTS: ${PALO_DOMAIN},127.0.0.1,localhost
      PALO_MCP_EXPOSED_TOOLS: palo_explain_framework,palo_infer_governance_route,palo_plan_product_integration
      PALO_MCP_HTTP_TOKEN_FILE: /run/secrets/palo_guide_mcp_token
      PALO_DATA_DIR: /var/lib/palo-guide
    secrets:
      - palo_guide_mcp_token
    volumes:
      - palo_guide_data:/var/lib/palo-guide
    ports:
      - 127.0.0.1:18879:8789
    networks: [backend, host_access]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/health',{headers:{Host:'127.0.0.1'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  palo-hub-migrate:
    profiles: [hub-migration]
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile
    command: ["node", "packages/palo-governance-control-plane/migrate.js"]
    read_only: true
    mem_limit: 384m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PALO_HUB_MODE: production
      PALO_HUB_DATABASE_URL_FILE: /run/secrets/palo_hub_migration_database_url
      PALO_HUB_DATABASE_APPLICATION_ROLE: ${PALO_HUB_DATABASE_APPLICATION_ROLE:-}
    secrets:
      - palo_hub_migration_database_url
    networks: [host_access]

  palo-hub-control-plane:
    profiles: [hub-control-plane]
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile
    command: ["node", "packages/palo-governance-control-plane/index.js"]
    restart: unless-stopped
    read_only: true
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      PALO_HUB_MODE: production
      PALO_HUB_HOST: 0.0.0.0
      PALO_HUB_PORT: 8790
      PALO_HUB_PUBLIC_URL: https://${PALO_DOMAIN}/control-plane
      PALO_HUB_ALLOWED_ORIGINS: https://${PALO_DOMAIN}
      PALO_HUB_DATABASE_URL_FILE: /run/secrets/palo_hub_database_url
      PALO_HUB_OIDC_ISSUER: ${PALO_HUB_OIDC_ISSUER:-}
      PALO_HUB_OIDC_AUTHORIZATION_ENDPOINT: ${PALO_HUB_OIDC_AUTHORIZATION_ENDPOINT:-}
      PALO_HUB_OIDC_TOKEN_ENDPOINT: ${PALO_HUB_OIDC_TOKEN_ENDPOINT:-}
      PALO_HUB_OIDC_JWKS_URI: ${PALO_HUB_OIDC_JWKS_URI:-}
      PALO_HUB_OIDC_CLIENT_ID: ${PALO_HUB_OIDC_CLIENT_ID:-}
      PALO_HUB_OIDC_AUDIENCE: ${PALO_HUB_OIDC_AUDIENCE:-}
      PALO_HUB_OIDC_CLIENT_SECRET_FILE: /run/secrets/palo_hub_oidc_client_secret
      PALO_HUB_STEP_UP_ACR_VALUES: ${PALO_HUB_STEP_UP_ACR_VALUES:-}
      PALO_HUB_ADAPTERS_JSON: "${PALO_HUB_ADAPTERS_JSON:-[]}"
      PALO_HUB_ADAPTER_TOKEN_FILE: /run/secrets/palo_hub_adapter_token
      PALO_HUB_SIGNER_URL: ${PALO_HUB_SIGNER_URL:-}
      PALO_HUB_SIGNER_TOKEN_FILE: /run/secrets/palo_hub_signer_token
      PALO_HUB_RUN_MIGRATIONS: "false"
      PALO_HUB_TRUST_PROXY: "true"
    secrets:
      - palo_hub_database_url
      - palo_hub_oidc_client_secret
      - palo_hub_adapter_token
      - palo_hub_signer_token
    ports:
      - 127.0.0.1:18880:8790
    networks: [host_access]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>r.json().then(j=>{if(!r.ok||j.status!=='ok'||!j.persistence.schemaCurrent)process.exit(1)})).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  palo-hub-ui:
    profiles: [hub-control-plane]
    build:
      context: ../../..
      dockerfile: deploy/vps/palo-ai/Dockerfile.hub
      args:
        VITE_PALO_CONTROL_PLANE_URL: /control-plane
        VITE_PALO_PUBLIC_SITE_URL: https://sev7enita.github.io/PALOframework
    restart: unless-stopped
    read_only: true
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - 127.0.0.1:18881:8080
    networks: [host_access]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  palo_gateway_token:
    file: ./secrets/gateway-token
  palo_mcp_token:
    file: ./secrets/mcp-token
  palo_guide_mcp_token:
    file: ./secrets/guide-mcp-token
  palo_hmac_keys:
    file: ./secrets/hmac-keys.json
  palo_hub_database_url:
    file: ./secrets/hub-database-url
  palo_hub_migration_database_url:
    file: ./secrets/hub-migration-database-url
  palo_hub_oidc_client_secret:
    file: ./secrets/hub-oidc-client-secret
  palo_hub_adapter_token:
    file: ./secrets/hub-adapter-token
  palo_hub_signer_token:
    file: ./secrets/hub-signer-token

volumes:
  palo_data:
  palo_guide_data:

networks:
  backend:
    internal: true
  host_access:
