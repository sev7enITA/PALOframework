limit_req_zone $binary_remote_addr zone=palo_reader_mcp:10m rate=60r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name governance.paloframework.org;

    ssl_certificate /etc/letsencrypt/live/governance.paloframework.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/governance.paloframework.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/palo-ai-access.log;
    error_log /var/log/nginx/palo-ai-error.log warn;
    client_max_body_size 1m;
    limit_req_status 429;

    location = /hub {
        return 308 /hub/;
    }

    location /hub/ {
        proxy_pass http://127.0.0.1:18881/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    location /control-plane/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:18880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /mcp-health {
        proxy_pass http://127.0.0.1:18878/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:18878/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:18878/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp-guide-health {
        proxy_pass http://127.0.0.1:18879/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "https://sev7enita.github.io" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
    }

    location = /.well-known/oauth-protected-resource/mcp-guide {
        proxy_pass http://127.0.0.1:18879/.well-known/oauth-protected-resource/mcp-guide;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "https://sev7enita.github.io" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
    }

    location = /mcp-guide {
        limit_req zone=palo_reader_mcp burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18879/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp-guide/mcp {
        limit_req zone=palo_reader_mcp burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18879/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp-guide-curator-health {
        proxy_pass http://127.0.0.1:18882/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "https://sev7enita.github.io" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
    }

    location = /.well-known/oauth-protected-resource/mcp-guide-curator {
        proxy_pass http://127.0.0.1:18882/.well-known/oauth-protected-resource/mcp-guide-curator;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "https://sev7enita.github.io" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
    }

    location = /mcp-guide-curator {
        proxy_pass http://127.0.0.1:18882/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp-guide-curator/mcp {
        proxy_pass http://127.0.0.1:18882/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /identity-health {
        proxy_pass http://127.0.0.1:19000/identity/health/ready;
        proxy_set_header Host localhost;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /identity/admin/ {
        return 404;
    }

    location ^~ /identity/realms/master/ {
        return 404;
    }

    location = /identity/realms/palo/.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:18883;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "https://sev7enita.github.io" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /identity/realms/palo/ {
        proxy_pass http://127.0.0.1:18883;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /identity/resources/ {
        proxy_pass http://127.0.0.1:18883;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /identity/ {
        return 404;
    }

    location = /gateway/v1/approvals/resolve {
        return 404;
    }

    location = /gateway/v1/incidents/resolve {
        return 404;
    }

    location ~ ^/gateway/(health|v1/registry|v1/actions/(verify|execute)|v1/executions/[^/]+(/(outcome|verify))?|v1/approvals/[^/]+|v1/incidents/[^/]+|v1/evidence/verify-ledger)$ {
        rewrite ^/gateway(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location /gateway/ {
        return 404;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name governance.paloframework.org;
    return 301 https://$host$request_uri;
}
