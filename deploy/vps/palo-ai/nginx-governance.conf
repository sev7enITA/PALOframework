server {
    listen 80;
    listen [::]:80;
    server_name governance.paloframework.org;

    access_log /var/log/nginx/palo-ai-access.log;
    error_log /var/log/nginx/palo-ai-error.log warn;
    client_max_body_size 1m;

    location = /hub {
        return 308 /hub/;
    }

    location /hub/ {
        proxy_pass http://127.0.0.1:18881/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    location /control-plane/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:18880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /mcp-health {
        proxy_pass http://127.0.0.1:18878/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:18878/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:18878/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp-guide-health {
        proxy_pass http://127.0.0.1:18879/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-protected-resource/mcp-guide {
        proxy_pass http://127.0.0.1:18879/.well-known/oauth-protected-resource/mcp-guide;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp-guide {
        proxy_pass http://127.0.0.1:18879/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /gateway/v1/approvals/resolve {
        return 404;
    }

    location = /gateway/v1/incidents/resolve {
        return 404;
    }

    location ~ ^/gateway/(health|v1/registry|v1/actions/(verify|execute)|v1/executions/[^/]+(/(outcome|verify))?|v1/approvals/[^/]+|v1/incidents/[^/]+|v1/evidence/verify-ledger)$ {
        rewrite ^/gateway(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18877;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location /gateway/ {
        return 404;
    }

    location / {
        return 404;
    }
}
