limit_req_zone $binary_remote_addr zone=palo_copilot_pre_auth:10m rate=30r/m;

# Deliberately omit query strings: the OIDC callback carries a one-time authorization code.
log_format palo_copilot_safe '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" request_id=$request_id';
