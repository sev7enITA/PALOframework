# Include these exact locations inside the HTTPS server block for PALO_DOMAIN.
# Do not add browser CORS headers and do not expose port 18879 publicly.

location = /mcp-guide-health {
    proxy_pass http://127.0.0.1:18879/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

location = /.well-known/oauth-protected-resource/mcp-guide {
    proxy_pass http://127.0.0.1:18879/.well-known/oauth-protected-resource/mcp-guide;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

location = /mcp-guide {
    limit_req zone=palo_guide_mcp burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:18879/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Compatibility alias for hosts that require an MCP endpoint ending in /mcp.
# The OAuth resource/audience remains the canonical /mcp-guide URL.
location = /mcp-guide/mcp {
    limit_req zone=palo_guide_mcp burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:18879/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
