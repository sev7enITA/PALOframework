name: Validate Tri-Graph reference
on:
  push:
    paths: ['packages/palo-tri-graph/**', 'data/tri-graph*', 'formal/palo-tri-graph*', 'schemas/palo-tri-graph*', 'semantic-catalogues/tri-graph/**', 'examples/tri-graph/**', 'scripts/*tri-graph*', '.github/workflows/tri-graph-reference.yml']
  pull_request:
    paths: ['packages/palo-tri-graph/**', 'data/tri-graph*', 'formal/palo-tri-graph*', 'schemas/palo-tri-graph*', 'semantic-catalogues/tri-graph/**', 'examples/tri-graph/**', 'scripts/*tri-graph*', '.github/workflows/tri-graph-reference.yml']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: packages/palo-tri-graph/package-lock.json
      - run: npm ci --prefix packages/palo-tri-graph --ignore-scripts
      - run: node scripts/generate-tri-graph.mjs --check
      - run: npm test --prefix packages/palo-tri-graph
      - run: python -m pip install pyshacl==0.40.2
      - run: python scripts/validate-tri-graph-shacl.py
