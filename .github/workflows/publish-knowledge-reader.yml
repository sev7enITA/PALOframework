name: Publish signed PALO Knowledge Reader

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag, for example reader-v1.0.0
        required: true
        type: string
      approval_reference:
        description: Owner and security-review approval record for this commit
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sev7enita/palo-knowledge-reader

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject an invalid release tag or empty approval
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$RELEASE_TAG" =~ ^reader-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -n "${APPROVAL_REFERENCE// }" ]]
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate the dedicated Reader and gold set
        run: npm run validate:knowledge-reader

  build_scan:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if docker manifest inspect "$IMAGE:$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $IMAGE:$RELEASE_TAG" >&2
            exit 1
          fi
      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and publish immutable multi-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/vps/palo-guide-mcp-standalone/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.release_tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
            org.opencontainers.image.title=PALO Knowledge Reader
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the exact registry digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-reader.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 1
      - name: Generate exact-digest SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: reader.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write candidate evidence for exact-digest review
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg approval "$APPROVAL_REFERENCE" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schemaVersion:"1.0.0",status:"candidate-awaiting-environment-approval",image:$image,digest:$digest,tag:$tag,commit:$commit,publishedBy:$actor,approvalReference:$approval,workflowRun:$runUrl,trivyPolicy:"zero HIGH and CRITICAL",sbom:"SPDX JSON"}' \
            > reader-candidate-evidence.json
      - name: Upload candidate evidence for reviewers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palo-reader-${{ inputs.release_tag }}-candidate
          retention-days: 90
          if-no-files-found: error
          path: |
            reader-candidate-evidence.json
            reader.spdx.json
            trivy-reader.json
      - name: Publish the candidate digest for exact review
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Candidate awaiting owner/security approval" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  admit:
    name: Admit ${{ needs.build_scan.outputs.digest }}
    needs: build_scan
    runs-on: ubuntu-latest
    environment: knowledge-reader-production
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the exact-digest review evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: palo-reader-${{ inputs.release_tag }}-candidate
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign and attest the admitted digest
        env:
          DIGEST: ${{ needs.build_scan.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate reader.spdx.json "$IMAGE@$DIGEST"
      - name: Write release evidence
        env:
          DIGEST: ${{ needs.build_scan.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg approval "$APPROVAL_REFERENCE" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schemaVersion:"1.0.0",status:"admitted-after-github-environment-approval",image:$image,digest:$digest,tag:$tag,commit:$commit,publishedBy:$actor,approvalReference:$approval,approvalEnvironment:"knowledge-reader-production",workflowRun:$runUrl,trivyPolicy:"zero HIGH and CRITICAL",signature:"sigstore-keyless",sbom:"SPDX JSON"}' \
            > reader-release-evidence.json
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palo-reader-${{ inputs.release_tag }}-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            reader-candidate-evidence.json
            reader-release-evidence.json
            reader.spdx.json
            trivy-reader.json
      - name: Publish exact digest in the job summary
        env:
          DIGEST: ${{ needs.build_scan.outputs.digest }}
        run: |
          echo "### PALO Knowledge Reader admitted image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Approval: ${{ inputs.approval_reference }}" >> "$GITHUB_STEP_SUMMARY"
