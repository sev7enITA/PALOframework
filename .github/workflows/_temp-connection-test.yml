name: Publish README citation and recognition

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_temp-connection-test.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply README update
        run: python3 .github/readme-recognition-update.py

      - name: Validate and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/readme-recognition-update.py
          rm .github/workflows/_temp-connection-test.yml
          git add README.md .github/readme-recognition-update.py .github/workflows/_temp-connection-test.yml
          git diff --cached --check
          git commit -m "Publish PALO citation and recognition details"
          git push
