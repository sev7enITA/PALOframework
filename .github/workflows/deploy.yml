name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            governance-hub/package-lock.json

      - name: Install root build dependencies
        run: npm ci --ignore-scripts

      - name: Install Governance Hub dependencies
        run: npm ci --prefix governance-hub

      - name: Verify cross-platform publication build
        run: npm run build

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: palo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d palo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            governance-hub/package-lock.json

      - name: Install toolchain
        run: |
          npm ci
          npm ci --prefix governance-hub

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install checksum-verified OPA
        run: npm run opa:install

      - name: Validate Governance Hub control plane and PostgreSQL RLS
        env:
          PALO_HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/palo_test
        run: npm run palo:hub:control-plane:test

      - name: Validate agentic contracts, policy, runtime, protocol, and connectors
        run: npm run validate:agentic

      - name: Validate authoring source
        run: npm run validate

      - name: Build allowlisted publication artifact
        run: npm run build

      - name: Validate publication artifact
        run: npm run validate:dist

      - name: Verify deterministic dist
        run: npm run build:check

      - name: Browser smoke
        run: npm run smoke

      - name: Governance Hub operational browser smoke
        run: npm run governance-hub:operational-smoke

      - name: Build Governance Hub deployment images
        run: |
          docker build -f deploy/vps/palo-ai/Dockerfile -t palo-runtime:ci .
          docker build -f deploy/vps/palo-ai/Dockerfile.hub -t palo-hub-ui:ci .

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload dist only
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dist to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
